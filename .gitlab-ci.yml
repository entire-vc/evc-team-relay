# CI for the GitLab canon (git.entire.host/entire-vc/evc-team-relay).
#
# ## Why this file exists
#
# Development moved from GitHub to GitLab on 2026-08-23 (§0z). The checks that
# guarded merges here live in `.github/workflows/` and are executed by GitHub
# Actions. They still run, on a repository nobody merges into any more. Until
# this file existed every merge request on the canon landed on `main` having
# been checked by nothing: no pipeline, no required check. Not a bypassed gate
# — an absent one.
#
# Modelled on `entire-vc/evc-mesh:.gitlab-ci.yml`, the first canon repo to get
# a pipeline.
#
# ## Honest scope — this is NOT a port of all of `.github/workflows/`
#
# It carries the control-plane checks (Ruff lint + format, pytest, the two
# alembic guards), the web-publish checks (svelte-check, vitest), and the hold
# gate. Deliberately absent, named rather than implied, because a stub that
# looks like full CI is more dangerous than a gap you can see:
#
#   * **build-docker** — the two `push:false` image builds. Needs a
#     docker-in-docker service on the one shared fleet runner. Not attempted
#     here; the npm blocker that used to compound it is gone.
#
#   * **semgrep, trivy, release-drift, release** — untouched. Releases still
#     live on GitHub by fleet rule (§0z p.5).
#
#   * **deploy** — no longer untouched: `trigger:prod-team-relay` below bridges
#     a successful push-to-main pipeline into `entire-vc/deploy`. The manual
#     SSH recipe in `docs/DEPLOY.md` still works as a fallback, it's just no
#     longer the only path.
#
# ## The half that is not in this file
#
# A pipeline is a display until `only_allow_merge_if_pipeline_succeeds` is true
# on the project — until then GitLab merges over a red run via the web button
# or a bare `glab mr merge`. That setting requires Maintainer rights on the
# project and is tracked separately.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, lint, test, deploy]

variables:
  # Services are reachable by their image alias on the docker executor, NOT on
  # localhost — the single most common wrong translation from a GitHub Actions
  # `services:` block, where port-mapping to localhost is how it works. Every
  # DATABASE_URL below therefore says `postgres`, not `localhost`, and that is
  # the one line to check first if a DB job ever starts failing to connect.
  POSTGRES_USER: control_plane
  POSTGRES_PASSWORD: control_plane
  POSTGRES_DB: control_plane
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

default:
  tags: [docker]
  interruptible: true

# ── gate ────────────────────────────────────────────────────────────────────
# Makes the `hold` label a gate here too. On GitHub this is a required status
# check (.github/workflows/hold-gate.yml); `~/bin/glab-merge` reads the same
# label list, but a wrapper is a request, not a wall — the web button and a
# bare `glab mr merge` never ask it.
#
# The label list is READ FROM `.github/hold-labels.txt`, the file already in
# this repository, rather than copied into this one. A second copy is a second
# thing to drift, and the fleet already paid for that once: the CI copy on
# evc-mesh drifted from the wrapper list within a day of being written.
hold-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -eu
      LABELS_FILE=.github/hold-labels.txt
      # Fail closed on every unknown. "I could not check" must never read the
      # same as "I checked and it is clean" — that equivalence is the defect
      # this whole gate family exists to kill.
      test -f "$LABELS_FILE" || { echo "REFUSING: $LABELS_FILE missing — cannot know what 'held' means"; exit 1; }
      HOLD=$(grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -c . || true)
      test "$HOLD" -gt 0 || { echo "REFUSING: $LABELS_FILE parsed to zero labels — a gate that knows no hold label passes everything"; exit 1; }
      echo "hold labels known: $HOLD"
      echo "labels on this merge request: '${CI_MERGE_REQUEST_LABELS:-}'"
      FOUND=""
      OLDIFS=$IFS; IFS=','
      for L in ${CI_MERGE_REQUEST_LABELS:-}; do
        L=$(printf '%s' "$L" | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -n "$L" ] || continue
        if grep -vE '^\s*(#|$)' "$LABELS_FILE" | tr 'A-Z' 'a-z' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -qxF "$L"; then
          FOUND="$FOUND $L"
        fi
      done
      IFS=$OLDIFS
      if [ -n "$FOUND" ]; then
        echo "REFUSING to let this merge request through: it carries a hold label —$FOUND"
        echo "Remove the label when the work is ready; this job re-runs on the next pipeline."
        exit 1
      fi
      echo "no hold label present ✓"

# ── control-plane ───────────────────────────────────────────────────────────
.uv_job: &uv_job
  # Debian, not alpine, on purpose: `psycopg[binary]` and `pillow` ship
  # manylinux wheels only. On a musl base pip falls back to building from
  # source and the job dies in a C compiler, which reads like a broken
  # dependency rather than a wrong base image.
  image: python:3.12-slim
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache/]
  before_script:
    - pip install --quiet --root-user-action=ignore uv
    - cd apps/control-plane
    - uv sync --extra dev --extra test

lint-python:
  <<: *uv_job
  stage: lint
  timeout: 15m
  script:
    - uv run ruff check app/ tests/
    - uv run ruff format --check app/ tests/

test-python:
  <<: *uv_job
  stage: test
  timeout: 30m
  script:
    - uv run pytest -v --tb=short

# Fresh-DB migration smoke — nothing else here exercises the alembic graph
# against a real database. Without it a broken revision chain (a down_revision
# pointing at a script that does not exist) only ever surfaces on a
# self-hoster's first `alembic upgrade head` against an empty database; prod
# never notices, because prod's alembic_version is already past the break.
# That is exactly what shipped in v1.9.0 for two months.
alembic-migration-smoke:
  <<: *uv_job
  stage: test
  timeout: 20m
  services:
    - name: postgres:16
      alias: postgres
  variables:
    DATABASE_URL: "postgresql+psycopg://control_plane:control_plane@postgres:5432/control_plane"
  script:
    - |
      set -eu
      heads=$(uv run alembic heads)
      echo "$heads"
      # `grep -c` under `set -e` exits 1 on zero matches, which would abort
      # before the count could be reported — hence `|| true`, and the real
      # verdict is the explicit -ne 1 test below.
      count=$(printf '%s\n' "$heads" | grep -c '(head)' || true)
      if [ "$count" -ne 1 ]; then
        echo "REFUSING: expected exactly 1 alembic head, found $count — resolve the split before merging"
        exit 1
      fi
      echo "alembic graph has exactly one head ✓"
    - uv run alembic upgrade head

# `alembic check` against real Postgres — blocking. It used to carry
# `allow_failure: true` while ~50 ops of PRE-EXISTING model/migration drift
# (unique-constraint duplication, idx_* vs SQLAlchemy's default ix_* naming,
# TEXT vs unbounded String, missing NOT NULL) accumulated well before this job
# existed sat unreconciled — reconciled in
# 202608260001_reconcile_model_schema_drift.py. The flag is gone now that the
# job is actually green;
# see that migration's docstring for exactly what was and wasn't safe to
# apply (six of autogenerate's proposed drops turned out to be live partial
# indexes on real hot-path queries — fixed in the model, not dropped).
check-migration-drift:
  <<: *uv_job
  stage: test
  timeout: 20m
  services:
    - name: postgres:16
      alias: postgres
  variables:
    DATABASE_URL: "postgresql+psycopg://control_plane:control_plane@postgres:5432/control_plane"
    JWT_SECRET: ci-test-secret-not-used-in-prod
    MINIO_ENDPOINT: ""
    MINIO_ACCESS_KEY: ci-key
    MINIO_SECRET_KEY: ci-secret
  script:
    - uv run alembic upgrade head
    - uv run alembic check

# ── web-publish (SvelteKit) ─────────────────────────────────────────────────
# @entire-vc/tokens and @entire-vc/ui-svelte are published on the PUBLIC npm
# registry, so `npm ci` here needs no registry config and no credential at all.
#
# History, because this job carried a token twice and both times it broke the
# other pipeline: the lockfile first pinned the two packages to
# npm.pkg.github.com (GitLab runners have no GitHub token — red here), then to
# the GitLab Package Registry of evc-brandkit, project 9 (GitHub runners cannot
# reach git.entire.host — red there). A private scope readable by exactly one
# of the two CI systems is unfixable by picking the other side; publishing the
# packages publicly is what ends the swap. The public copies also keep the
# showcase mirror's lockfile free of an internal hostname and project number.
.web_publish_job: &web_publish_job
  image: node:22-alpine
  timeout: 20m
  cache:
    key:
      files: [apps/web-publish/package-lock.json]
    paths: [apps/web-publish/.npm/]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/apps/web-publish/.npm"
  before_script:
    - cd apps/web-publish
    - npm ci

typecheck-svelte:
  <<: *web_publish_job
  stage: lint
  script:
    - npm run check

test-svelte:
  <<: *web_publish_job
  stage: test
  script:
    - npm test
# ── deploy ──────────────────────────────────────────────────────────────────
# Ships the production control plane on merge to the canonical branch. Before
# this job a human had to press the button in `entire-vc/deploy`; modelled on
# the `trigger:prod-backend` bridge in `entire-vc/evc-mesh:.gitlab-ci.yml`,
# where the same bridge already runs.
#
# ## Gate scope = what this deployment ACTUALLY ships
#
# `deploy:team-relay` clones this repository, rsyncs `apps/control-plane` to
# production and then runs the migrations. So the gate has to cover the whole
# control plane:
#
#   included  lint-python              ruff over that same `apps/control-plane`;
#             test-python              pytest over the same tree;
#             alembic-migration-smoke  ← LOAD-BEARING. The only place where the
#                                        migration graph is run against a real
#                                        empty database;
#             check-migration-drift    ← LOAD-BEARING. `alembic check`: drift
#                                        between the models and the schema.
#
# ⚠️ The two migration jobs here are not "two more tests". Including them in
# `needs` is what turns "migration before code, never the other way round"
# from a convention into a machine-enforced gate. Auto-deploying without them
# would mean code reaches production on merge while a schema mismatch only
# surfaces under a live 500 — the worst possible shape of that failure,
# because it happens after the deployment.
#
#   excluded  hold-gate — see below; including it is a trap, not a saving.
#
# ## ⚠️ Why hold-gate MUST NOT be listed in needs
#
# It carries `rules: - if: $CI_PIPELINE_SOURCE == "merge_request_event"`, so
# it does not exist at all in a push pipeline on `main`. A job that requires a
# job which does not exist breaks pipeline creation entirely: the merge yields
# no pipeline, no deployment, and NOT ONE error message.
#
# The `needs` list below was not derived by reading this file but by measuring
# a real push pipeline on `main`: it contains exactly four jobs — lint-python,
# test-python, alembic-migration-smoke, check-migration-drift — and no
# `hold-gate`. The rule generalises: before adding a job to `needs`, look at an
# ACTUAL push pipeline on `main`, not at the yaml.
trigger:prod-team-relay:
  stage: deploy
  # Pushes to the canonical branch only. It does not run on merge request
  # pipelines: there is nothing to deploy there.
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  needs: ["lint-python", "test-python", "alembic-migration-smoke", "check-migration-drift"]
  # ⚠️ Set EXPLICITLY, against `default: interruptible: true` above. An
  # interruptible job would be cancelled by the next push to main — together
  # with its downstream pipeline, i.e. in the middle of a deployment. For a
  # product with migrations that is the most expensive moment to be
  # interrupted: between `alembic upgrade head` and the application restart,
  # production is left holding the new code's schema while the old code runs.
  interruptible: false
  variables:
    # The key by which the deploy project tells an automatic trigger from a
    # manual button press.
    DEPLOY_TEAM_RELAY: "1"
  trigger:
    project: entire-vc/deploy
    branch: main
    # ⚠️ `strategy: depend` MUST NOT be used here, however much the semantics
    # invite it. The pipeline in `entire-vc/deploy` is SHARED by all products,
    # and its aggregate status hangs on manual jobs belonging to other products
    # that nobody is obliged to press — most recent pipelines there simply stay
    # `manual`. `depend` would wait forever for a terminal status and, on
    # timeout, paint the canonical `main` RED even though the deployment
    # succeeded. A false red on every merge is worse than no signal at all: it
    # teaches people to stop looking at the colour of main.
    #
    # What covers a failed deployment instead: `verify:team-relay` in the
    # deploy pipeline goes red on its own — it checks `/health` by CONTENT
    # (`"ok":true`) rather than by response code, because `/` answers 302
    # identically for a live application and for a bare proxy in front of a
    # dead backend.
    #
    # ⚠️ The honest boundary of this bridge: `deploy:team-relay` clones
    # `--branch ${PRODUCT_REF:-main}`, i.e. it ships `main` AS OF THE CLONE,
    # not the commit that fired the trigger. With two merges in quick
    # succession both deployments carry the second commit. That is harmless for
    # a catch-up deployment, but it means "the job is green" does not prove
    # that this exact commit is in production — `verify:team-relay` and the
    # drift watchdog prove that.
