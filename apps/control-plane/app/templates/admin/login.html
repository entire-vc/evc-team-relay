<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entire VC Team Relay - Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/evc-ava.svg">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .login-brand a {
            display: flex;
            transition: opacity 0.2s;
        }
        .login-brand a:hover {
            opacity: 0.8;
        }
        .login-brand img {
            border-radius: 8px;
        }
        .login-brand span {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
        }
        .btn-full {
            width: 100%;
            text-align: center;
        }
        .login-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted, #888);
            margin: 1rem 0;
        }
        .login-divider::before,
        .login-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border, #ddd);
        }
        .login-divider span {
            padding: 0 0.75rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <a href="/">
                    <img src="/static/img/evc-ava.svg" alt="EVC Team Relay" width="48" height="48">
                </a>
                <span>Team Relay</span>
            </div>
            <h1>Admin Login</h1>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            {% if oauth_enabled %}
            <!-- oauth_authorize_url: base_url comes from get_base_url() (trusted,
                 never client headers) and redirect_uri/return_url are quote()d
                 by build_admin_oauth_urls() before being embedded — see that
                 function's docstring. Same pattern as invite.html. -->
            <!-- nosemgrep: generic.html-templates.security.var-in-href.var-in-href -->
            <a href="{{ oauth_authorize_url }}" class="btn btn-primary btn-full">
                Sign in with Casdoor
            </a>

            <div class="login-divider">
                <span>or</span>
            </div>
            {% endif %}

            <form method="POST" action="/admin-ui/login" data-validate>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       placeholder="admin@example.com" value="{{ email or '' }}">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password">

                <button type="submit">Login</button>
            </form>

            <p class="text-muted text-center mt-2">
                Relay Control Plane Admin Panel
            </p>
        </div>
    </div>
</body>
</html>
