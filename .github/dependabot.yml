version: 2
updates:
  # Control-plane (Python / uv) — apps/control-plane
  - package-ecosystem: "pip"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Web-publish (npm) — apps/web-publish
  - package-ecosystem: "npm"
    directory: "/apps/web-publish"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
