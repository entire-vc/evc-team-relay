version: 2
updates:
  # Control-plane (Python / uv) — apps/control-plane
  - package-ecosystem: "pip"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # Same supply-chain rationale as min-release-age=7 in the npm .npmrc:
    # give a fresh release 7 days to get pulled/flagged before Dependabot
    # proposes it here.
    cooldown:
      default-days: 7

  # Web-publish (npm) — apps/web-publish
  - package-ecosystem: "npm"
    directory: "/apps/web-publish"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # @sveltejs/kit 2.x declares peerDependencies.typescript = "^5.3.3 || ^6.0.0".
      # TypeScript 7 is outside that range → npm ci fails on ERESOLVE before typecheck (PR #183).
      # LIFT when SvelteKit widens the range to 7.x — check with one command:
      #   npm view @sveltejs/kit peerDependencies.typescript
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
