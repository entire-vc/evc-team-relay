version: 2
updates:
  # Control-plane (Python / uv) — apps/control-plane
  - package-ecosystem: "pip"
    directory: "/apps/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # Same supply-chain rationale as min-release-age=7 in the npm .npmrc:
    # give a fresh release 7 days to get pulled/flagged before Dependabot
    # proposes it here.
    cooldown:
      default-days: 7

  # Web-publish (npm) — apps/web-publish
  - package-ecosystem: "npm"
    directory: "/apps/web-publish"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
