name: Checks (control-plane)

# The control-plane's lint + test suite, factored out of ci.yml so that ci.yml
# and deploy.yml run the SAME checks instead of two copies that drift.
#
# Why this exists: until 2026-07-26 `deploy.yml` shipped to production on every
# push to main with no relationship to `ci.yml` whatsoever — no `needs:`, no
# `workflow_run`, and no `required_status_checks` in branch protection. CI was
# red on every run for 17 days and deployed anyway, because nothing connected
# the two. Making both callers depend on one reusable definition is what turns
# "CI is green" into an actual precondition for reaching prod.
#
# Scope is deliberately control-plane only — NOT the svelte jobs. deploy.yml
# rsyncs `apps/control-plane/` and runs `deploy.sh control-plane`; it does not
# ship web-publish at all. Gating a backend deploy on a frontend test would
# block correct deploys for an unrelated failure. When web-publish gets its own
# automated deploy path, it gets its own gate alongside this one.

on:
  workflow_call:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with Ruff
        working-directory: apps/control-plane
        run: |
          uv sync --extra dev --extra test
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        working-directory: apps/control-plane
        run: |
          uv sync --extra dev --extra test
          uv run pytest -v --tb=short

  alembic-migration-smoke:
    # Fresh-DB migration smoke — nothing else in this workflow exercises the
    # alembic graph against a real database. Without this, a broken revision
    # chain (a down_revision pointing at a script that doesn't exist) only
    # ever surfaces on a self-hoster's first `alembic upgrade head` against an
    # empty database — prod never notices, because prod's alembic_version is
    # already past the break. That's exactly what shipped in v1.9.0 for two
    # months (GH #177 / Mesh #1ca96abc): every fresh install failed at
    # `KeyError: '202602190001'` before creating a single table.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
          POSTGRES_DB: control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://control_plane:control_plane@localhost:5432/control_plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        working-directory: apps/control-plane
        run: uv sync --extra dev --extra test

      - name: Migration graph integrity (exactly one head)
        working-directory: apps/control-plane
        run: |
          heads=$(uv run alembic heads)
          echo "$heads"
          count=$(grep -c '(head)' <<< "$heads")
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count — resolve the split before merging"
            exit 1
          fi

      - name: Fresh-DB alembic upgrade head
        working-directory: apps/control-plane
        run: uv run alembic upgrade head
