name: Deploy

# Automated deploy of the control plane to a relay host over SSH, with a
# fail-closed migration gate.
#
# Sequence:
#   1. rsync apps/control-plane/ -> $TARGET_HOST:$RELAY_DIR/control-plane-src/
#   2. build image on the server
#   3. run `control-plane-migrate` (alembic upgrade head) — FAIL-CLOSED
#   4. only on migrate exit 0: `docker compose up -d` the app services
#
# A failed migration fails the job BEFORE any app container is restarted; prod is
# left running the previous image. See scripts/deploy.sh for the on-server logic
# and docs/DEPLOY.md for the runbook + required repository secrets/variables.
#
# ── Reaching a host that has no public address ───────────────────────────────
# The target may sit on a private network behind a bastion. Both endpoints come
# from repository *variables* (`vars.DEPLOY_TARGET_HOST`, `vars.DEPLOY_PROXY_HOST`),
# never from this file: a fork of this repository has no production topology in
# it, and a host move is a settings change rather than a commit. Variables, not
# secrets, on purpose — GitHub masks every secret as `***` in run logs, and a
# masked hostname makes an SSH failure undebuggable from the run output. Both
# are required: the job refuses to run with either one unset, rather than
# ssh-ing to nowhere.
#
# Give the bastion account the narrowest grant that still works: no shell
# (`/usr/sbin/nologin`) and a forced-command + `permitopen` restriction pinned to
# this product's own host and port in its `authorized_keys`, so the credential
# this workflow holds can do exactly one thing — open a TCP forward to that one
# host. Reaching any neighbouring machine is then refused by sshd itself.
#
# NOTE — why this runs on `ubuntu-latest` and NOT a self-hosted runner:
# this repository is PUBLIC and forkable, and ci.yml/trivy.yml both trigger on
# `pull_request`. For a fork PR, GitHub executes the workflow file *from the PR
# branch*, so any self-hosted runner registered here could be hijacked by a fork
# PR that simply re-points `runs-on` at it — and that runner would be a machine
# with a production SSH key sitting on its disk. Secrets, by contrast, are never
# exposed to fork-PR workflows. Keeping the deploy on a GitHub-hosted runner with
# the credential in a secret is what makes this safe on a public repo.
# Do not "optimise" this into a self-hosted runner.

on:
  push:
    branches: [main]
    # Deliberately does NOT include '.github/**'. Two reasons: (1) editing CI
    # plumbing is not a reason to rebuild and restart production, and (2) a
    # workflow that lists its own path here redeploys prod the moment it is
    # merged — which would have meant the very first landing of this file
    # shipping to prod with no rehearsal. Same convention as evc-spark.
    paths:
      - 'apps/control-plane/**'
      - 'scripts/deploy.sh'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the migration gate but do NOT restart the app (rehearsal)'
        type: boolean
        default: false

# Never run two deploys to the same host concurrently. Do not cancel an
# in-progress deploy — a half-applied migration is worse than a queued one.
concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate: do not ship control-plane code that does not lint and pass tests ──
  #
  # Until this landed, deploy.yml had NO relationship to ci.yml — no `needs:`,
  # no `workflow_run`, and branch protection carries no required_status_checks.
  # So `main` sat red for 17 straight days (since 2026-07-09) while every push
  # deployed to production regardless. A check that gates nothing also hides new
  # breakage, because a job that is always red is a job nobody reads.
  #
  # This runs the SAME reusable definition ci.yml runs, so the gate cannot drift
  # from CI. It is scoped to the control-plane on purpose: the deploy job below
  # rsyncs `apps/control-plane/` and calls `deploy.sh control-plane`, so the
  # svelte jobs are not in this deploy's blast radius and must not be able to
  # block it. web-publish is still deployed by hand; when it gets an automated
  # path it gets its own gate, not a share of this one.
  #
  # Cost: ~10 min (pytest) added before prod is touched. That is the price of
  # not shipping untested code, and it is paid in parallel with nothing else —
  # the on-server migration gate and edition smoke gate in scripts/deploy.sh
  # still run after this, and still fail closed with a rollback to `:prev`.
  #
  # A gate can only fail closed: if these checks fail, prod keeps running the
  # previous image and the deploy workflow goes red with the reason.
  gate:
    uses: ./.github/workflows/checks-control-plane.yml

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      # Host endpoints come from repository variables, not from this file and
      # not from secrets. Not from the file, because this repository is a public
      # showcase and its deploy topology is not part of what it publishes. Not
      # from secrets, because GitHub masks every secret as `***` in run logs and
      # that actively hurt once: when the target host value turned out to carry
      # two stray characters, the resulting "no pinned host key" failure was
      # undebuggable from the run output. Variables are unmasked and editable
      # without a commit, which is what these values actually need.
      RELAY_DIR: /opt/relay
      TARGET_HOST: ${{ vars.DEPLOY_TARGET_HOST }}
      TARGET_USER: ${{ vars.DEPLOY_TARGET_USER || 'root' }}
      TARGET_PORT: ${{ vars.DEPLOY_TARGET_PORT || '22' }}
      PROXY_HOST: ${{ vars.DEPLOY_PROXY_HOST }}
      PROXY_USER: ${{ vars.DEPLOY_PROXY_USER || 'ghdeploy' }}
      # Fingerprint of the dedicated deploy key. Pinned so a truncated, swapped
      # or rotated key fails with that fact stated, instead of as an anonymous
      # "Permission denied (publickey)". This is a public-key fingerprint, not a
      # credential; it stays in the file on purpose, so rotating the key and
      # updating its pin are the same reviewed change.
      DEPLOY_KEY_FINGERPRINT: 'SHA256:5DdPar8rAhyfVMEs42EN0zYRFA8a5DDdzMEtsx/cc+E'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH (ProxyJump through the bastion)
        env:
          SSH_KEY_B64: ${{ secrets.TW_RELAY_SSH_KEY_B64 }}
          KNOWN_HOSTS_B64: ${{ secrets.TW_RELAY_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail

          # Fail closed on a missing secret or variable. Without this an empty
          # value would turn into an ssh to nowhere with a confusing error three
          # steps later.
          missing=""
          for v in SSH_KEY_B64 KNOWN_HOSTS_B64; do
            [ -n "${!v:-}" ] || missing="$missing secrets.$v"
          done
          # TARGET_HOST/PROXY_HOST live in repository variables. An unset
          # variable expands to an empty string with no warning, which would
          # turn into an ssh to nowhere with a confusing error three steps
          # later — name it here instead.
          for v in TARGET_HOST PROXY_HOST; do
            [ -n "${!v:-}" ] || missing="$missing vars.DEPLOY_$v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing/empty required setting(s):$missing"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Both secrets travel base64-encoded, for the same reason: a raw
          # multi-line value does NOT survive `gh secret set` intact. Measured on
          # this repo: a 12-line known_hosts arrived as its last line only, and a
          # 432-byte/8-line private key arrived as 418 bytes/7 lines. Base64 is a
          # single line, so there is nothing to truncate.
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/tr_deploy
          chmod 600 ~/.ssh/tr_deploy

          # Assert the key is the one we expect. Without this, every way the key
          # can be wrong — truncated, rotated, replaced — surfaces identically as
          # "Permission denied (publickey)" from a host that cannot tell you why.
          actual_fp="$(ssh-keygen -y -f ~/.ssh/tr_deploy 2>/dev/null | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')"
          if [ -z "$actual_fp" ]; then
            echo "::error::TW_RELAY_SSH_KEY_B64 did not decode into a usable private key"
            exit 1
          fi
          if [ "$actual_fp" != "$DEPLOY_KEY_FINGERPRINT" ]; then
            echo "::error::deploy key fingerprint mismatch: got $actual_fp, expected $DEPLOY_KEY_FINGERPRINT"
            exit 1
          fi

          # Pinned host keys for BOTH hops, with StrictHostKeyChecking on, so a
          # MITM on either hop fails the job instead of silently deploying
          # through an attacker.
          #
          # This travels base64-encoded on purpose. A raw multi-line value does
          # NOT round-trip reliably through `gh secret set`: the first revision of
          # this workflow uploaded a 12-line known_hosts and the runner received
          # only its LAST line, which left the ProxyJump hop completely unpinned.
          # Base64 is a single line, so there is nothing to truncate.
          printf '%s' "$KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # ...and do not TRUST that it arrived intact — assert it. A pin that
          # silently covers only one of the two hops still *looks* like pinning:
          # the deploy either dies with an opaque "Host key verification failed"
          # halfway through, or, if anyone ever re-adds a TOFU fallback, sails
          # through unpinned. Fail closed here instead, where the cause is obvious.
          for h in "$PROXY_HOST" "$TARGET_HOST"; do
            if ! ssh-keygen -F "$h" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
              echo "::error::TW_RELAY_KNOWN_HOSTS_B64 has no pinned key for one of the two SSH hops (proxy or target) — refusing to deploy"
              exit 1
            fi
          done

          cat > ~/.ssh/config <<EOF
          Host tr-jump
            HostName ${PROXY_HOST}
            User ${PROXY_USER}
            IdentityFile ~/.ssh/tr_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host relay-target
            HostName ${TARGET_HOST}
            Port ${TARGET_PORT}
            User ${TARGET_USER}
            IdentityFile ~/.ssh/tr_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyJump tr-jump
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify connectivity to prod (fail fast, before touching anything)
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes relay-target \
            'echo "connected: $(hostname) / $(hostname -I | cut -d" " -f1)"'

      - name: Sync control-plane source to the target host
        run: |
          set -euo pipefail
          # --delete keeps the server source in lock-step with the repo; never
          # touches the server-managed docker-compose.yml / .env (outside src dir).
          rsync -az --delete \
            -e "ssh -o BatchMode=yes" \
            apps/control-plane/ \
            "relay-target:${RELAY_DIR}/control-plane-src/"

      - name: Build, migrate (fail-closed), and restart
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # Run the on-server deploy script over stdin. Its exit code propagates
          # back here: a failed migration gate (set -e + explicit exit) fails this
          # step BEFORE `compose up`, so the app is never restarted on a bad migration.
          ssh -o BatchMode=yes relay-target \
            "RELAY_DIR='${RELAY_DIR}' DRY_RUN='${DRY_RUN}' bash -s -- control-plane" \
            < scripts/deploy.sh

      - name: Remove the runner's copy of the deploy key
        if: always()
        run: shred -u ~/.ssh/tr_deploy 2>/dev/null || rm -f ~/.ssh/tr_deploy
