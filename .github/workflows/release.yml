name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    # One leg per (image, platform) pair, each on a NATIVE runner for that
    # platform -- not `platforms: linux/amd64,linux/arm64` on a single amd64
    # runner, which would build arm64 under QEMU. Measured cost difference
    # (runs 32436501549, 32436883170): arm64 native on ubuntu-24.04-arm ~18s
    # vs ~130s under QEMU on ubuntu-latest, for a cold control-plane build.
    # Native ARM runners are free on public repos, so there's no QEMU tradeoff
    # to make here. Each leg pushes by digest only (no tag) -- `merge` below
    # assembles the real tags from these digests via `imagetools create`,
    # which is what makes the multi-platform manifest, not this job.
    strategy:
      fail-fast: false
      matrix:
        image: [control-plane, web-publish]
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
          - name: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug for artifact naming
        id: slug
        run: echo "slug=$(echo '${{ matrix.platform.name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }} (${{ matrix.platform.name }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/${{ matrix.image }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.slug.outputs.slug }}
          # web-publish's Dockerfile needs this to `npm ci` against our
          # private @entire-vc scope. Every leg runs its own real npm ci --
          # there is no cross-platform GHA cache entry to replay from on a
          # platform's first-ever build, which is exactly what caught this
          # secret being missing in the first place (see git blame / #222).
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image }}
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${{ matrix.image }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/${{ matrix.image }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Assembles the per-platform digests from `build` into the real
    # multi-platform manifest for each image's semver tags -- no rebuild,
    # imagetools just writes a manifest list pointing at the already-pushed
    # digests. Same "merge by digest, don't rebuild" shape this workflow
    # already used for `latest` in promote-latest below.
    needs: build
    strategy:
      matrix:
        image: [control-plane, web-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # No `latest` here on purpose: this job runs before smoke-test, so
          # tagging `latest` here would move it onto an unvalidated image the
          # moment a build succeeds — a failing smoke-test would then leave
          # self-hosters' default `pull-published-images.sh` pulling a broken
          # release forever, with the GitHub Release itself never created to
          # signal anything went wrong. `latest` only moves in promote-latest,
          # after smoke-test has passed against these exact immutable tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word-splitting is deliberate here:
          # each $() expands to multiple `-t <tag>` / `<ref>@sha256:...`
          # arguments for imagetools create, not one string.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect merged manifest
        run: |
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}'

  smoke-test:
    # Boots the JUST-PUBLISHED images against a clean database and asserts
    # /health. This is what issue #177 needed: the team's own deploy migrates
    # a database that already passed whatever revision a release was cut at,
    # so a broken migration or a fresh-install-only crash (e.g. a bootstrap
    # bug) is invisible to us and visible only to an external user starting
    # from nothing. Deliberately does NOT reuse cache-from/cache-to or any
    # locally-built layer — it pulls from ghcr exactly like an external
    # installer's `bash scripts/pull-published-images.sh` would.
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate relay keypair + env
        working-directory: infra
        run: |
          openssl genpkey -algorithm ed25519 -out relay_private.pem
          RELAY_PRIVATE_KEY_B64=$(openssl base64 -A -in relay_private.pem)
          RELAY_PUBLIC_KEY_B64=$(python3 -c "
          from cryptography.hazmat.primitives import serialization
          import base64
          with open('relay_private.pem', 'rb') as f:
              priv = serialization.load_pem_private_key(f.read(), password=None)
          pub = priv.public_key().public_bytes(encoding=serialization.Encoding.Raw, format=serialization.PublicFormat.Raw)
          print(base64.b64encode(pub).decode())
          ")

          cp env.example .env
          sed -i "s|^DOMAIN_BASE=.*|DOMAIN_BASE=localhost|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^RELAY_PRIVATE_KEY=.*|RELAY_PRIVATE_KEY=${RELAY_PRIVATE_KEY_B64}|" .env

          cp relay/relay.toml.example relay/relay.toml
          sed -i 's|url = "https://relay.example.com"|url = "ws://localhost:8080"|' relay/relay.toml
          sed -i 's|key_id = "REPLACE_WITH_KEY_ID"|key_id = "relay_cp_dev"|' relay/relay.toml
          sed -i "s|public_key = \"REPLACE_WITH_PUBLIC_KEY_BASE64\"|public_key = \"${RELAY_PUBLIC_KEY_B64}\"|" relay/relay.toml
          sed -i 's|access_key = "MINIO_ROOT_USER"|access_key = "relay"|' relay/relay.toml
          sed -i 's|secret_key = "MINIO_ROOT_PASSWORD"|secret_key = "change-this-too"|' relay/relay.toml

      - name: Pull published images (this release's tag)
        run: bash scripts/pull-published-images.sh "${GITHUB_REF_NAME#v}"

      - name: Boot clean stack
        working-directory: infra
        run: |
          docker compose up -d postgres minio minio-init control-plane-migrate control-plane relay-server web-publish
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" infra-control-plane-1 2>/dev/null)" = "healthy" ]; do sleep 3; done'

      - name: Check /health on a clean database
        working-directory: infra
        run: |
          RESULT=$(docker compose exec -T control-plane python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read().decode())")
          echo "control-plane /health: $RESULT"
          echo "$RESULT" | grep -q '"ok": *true' || (echo "::error::control-plane /health did not report ok:true" && exit 1)

      - name: Dump logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs

  promote-latest:
    # Moves `latest` onto the images this run just built, but ONLY after
    # smoke-test has proven them against a clean database exactly the way
    # `pull-published-images.sh` (the default self-hoster install path) would
    # pull them. No rebuild here — `imagetools create` just repoints the
    # `latest` tag at the already-pushed, already-tested manifest by digest,
    # so this cannot silently diverge from what smoke-test actually checked.
    needs: [merge, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at this release's tested images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for IMAGE in control-plane web-publish; do
            REF="${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}:${VERSION}"
            docker buildx imagetools create --tag "${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}:latest" "$REF"
          done

  create-release:
    needs: [merge, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          body: |
            ## Docker Images

            ```bash
            docker pull ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/web-publish:${{ github.ref_name }}
            ```

            See [installation guide](https://github.com/${{ github.repository }}/blob/main/docs/installation.md) for setup instructions.
