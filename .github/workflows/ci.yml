name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with Ruff
        working-directory: apps/control-plane
        run: |
          uv sync --extra dev --extra test
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        working-directory: apps/control-plane
        run: |
          uv sync --extra dev --extra test
          uv run pytest -v --tb=short

  typecheck-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-publish
        run: npm run check

  test-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        run: npm ci

      - name: Run tests
        working-directory: apps/web-publish
        run: npm test

  check-migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check migration drift
        working-directory: apps/control-plane
        env:
          # Real Postgres, not SQLite — migration history contains Postgres-only
          # DDL (DO $$ ... END$$ conditional CREATE TYPE) that SQLite's dialect
          # cannot parse; SQLite would fail on every PR regardless of drift.
          DATABASE_URL: postgresql+psycopg://relay:relay-ci@localhost:5432/relay
          JWT_SECRET: ci-test-secret-not-used-in-prod
          MINIO_ENDPOINT: ""
          MINIO_ACCESS_KEY: ci-key
          MINIO_SECRET_KEY: ci-secret
        run: |
          uv sync --extra dev --extra test
          uv run alembic upgrade head
          uv run alembic check

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, typecheck-svelte, test-svelte, check-migration-drift]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build control-plane
        uses: docker/build-push-action@v6
        with:
          context: apps/control-plane
          push: false
          tags: evc-team-relay/control-plane:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-publish
        uses: docker/build-push-action@v6
        with:
          context: apps/web-publish
          push: false
          tags: evc-team-relay/web-publish:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
