name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

jobs:
  # control-plane lint + tests. Defined in a reusable workflow because
  # deploy.yml gates the production deploy on these exact same checks — one
  # definition, two callers, no drift between "what CI ran" and "what the
  # deploy gate ran". See checks-control-plane.yml for why.
  checks-control-plane:
    uses: ./.github/workflows/checks-control-plane.yml

  typecheck-svelte:
    runs-on: ubuntu-latest
    # @entire-vc/tokens and @entire-vc/ui-svelte are on the PUBLIC npm
    # registry, so `npm ci` needs no credential and no `packages: read`.
    # Both were previously private: first on GitHub Packages (401 here without
    # a token), then in the GitLab Package Registry (404 here, because GitHub
    # runners cannot reach the internal host at all) — a scope readable by only
    # one of the two CI systems could not be green in both.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-publish
        run: npm run check

  test-svelte:
    runs-on: ubuntu-latest
    # See typecheck-svelte above: @entire-vc/* is public, no credential needed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        run: npm ci

      - name: Run tests
        working-directory: apps/web-publish
        run: npm test

  check-migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check migration drift
        working-directory: apps/control-plane
        # Blocking. Used to carry `continue-on-error: true` while ~50 ops of
        # PRE-EXISTING model/migration drift accumulated before this job
        # existed sat unreconciled — reconciled in
        # 202608260001_reconcile_model_schema_drift.py (Mesh task af34b19f;
        # see that migration's docstring for what was and wasn't safe to
        # apply). This repo's canon is now GitLab (git.entire.host, §0z) —
        # this workflow runs on the read-only showcase mirror — but the same
        # false-green class applies here too, so the flag comes off in both
        # places in one change.
        env:
          # Real Postgres, not SQLite — migration history contains Postgres-only
          # DDL (DO $$ ... END$$ conditional CREATE TYPE) that SQLite's dialect
          # cannot parse; SQLite would fail on every PR regardless of drift.
          DATABASE_URL: postgresql+psycopg://relay:relay-ci@localhost:5432/relay
          JWT_SECRET: ci-test-secret-not-used-in-prod
          MINIO_ENDPOINT: ""
          MINIO_ACCESS_KEY: ci-key
          MINIO_SECRET_KEY: ci-secret
        run: |
          uv sync --extra dev --extra test
          uv run alembic upgrade head
          uv run alembic check

  build-docker:
    runs-on: ubuntu-latest
    needs: [checks-control-plane, typecheck-svelte, test-svelte, check-migration-drift]
    # Both builds are push:false and both install only from public registries,
    # so read access to the repository contents is all this job needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # No DockerHub login here on purpose: both builds below use push:false
      # (this job only validates the image builds — the real push+login lives
      # in release.yml, gated on push-to-main). A login step here served no
      # purpose except failing on Dependabot PRs, which never receive repo
      # secrets by GitHub design (`DOCKERHUB_USERNAME`/`DOCKERHUB_TOKEN` come
      # back empty) — every Dependabot-authored PR hit this unconditionally.

      - name: Build control-plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/control-plane
          push: false
          tags: evc-team-relay/control-plane:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/web-publish
          push: false
          tags: evc-team-relay/web-publish:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
