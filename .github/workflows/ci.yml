name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

jobs:
  # control-plane lint + tests. Defined in a reusable workflow because
  # deploy.yml gates the production deploy on these exact same checks — one
  # definition, two callers, no drift between "what CI ran" and "what the
  # deploy gate ran". See checks-control-plane.yml for why.
  checks-control-plane:
    uses: ./.github/workflows/checks-control-plane.yml

  typecheck-svelte:
    runs-on: ubuntu-latest
    # apps/web-publish/.npmrc points @entire-vc/* at npm.pkg.github.com, so
    # `npm ci` needs a token that may read this org's packages. Without it npm
    # sends no credential and GitHub Packages answers 401 "unauthenticated" —
    # which is exactly how this job and test-svelte were born red on 2026-07-09
    # (#104) and stayed red for every run after. Same fix the web-publish Docker
    # build already got in #30, just applied to the bare-runner jobs too.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        # .npmrc reads the token from ${GITHUB_TOKEN}; an unset var expands to
        # an empty _authToken, which npm sends as an anonymous request.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-publish
        run: npm run check

  test-svelte:
    runs-on: ubuntu-latest
    # See typecheck-svelte above: private @entire-vc packages need packages:read.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-publish/package-lock.json

      - name: Install deps
        working-directory: apps/web-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run tests
        working-directory: apps/web-publish
        run: npm test

  check-migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Check migration drift
        working-directory: apps/control-plane
        # Non-fatal for now: `alembic check` against real Postgres surfaces
        # substantial PRE-EXISTING model/migration drift (JSON vs JSONB variant
        # declarations, idx_* vs SQLAlchemy's default ix_* naming convention,
        # TEXT vs unbounded String) accumulated well before this job existed —
        # reconciling all of it is its own dedicated schema-hygiene task, not
        # something to silently auto-migrate here. Until that lands, this step
        # runs and logs real drift for review but does not fail the job, so it
        # doesn't turn every future PR permanently red on unrelated debt.
        continue-on-error: true
        env:
          # Real Postgres, not SQLite — migration history contains Postgres-only
          # DDL (DO $$ ... END$$ conditional CREATE TYPE) that SQLite's dialect
          # cannot parse; SQLite would fail on every PR regardless of drift.
          DATABASE_URL: postgresql+psycopg://relay:relay-ci@localhost:5432/relay
          JWT_SECRET: ci-test-secret-not-used-in-prod
          MINIO_ENDPOINT: ""
          MINIO_ACCESS_KEY: ci-key
          MINIO_SECRET_KEY: ci-secret
        run: |
          uv sync --extra dev --extra test
          uv run alembic upgrade head
          uv run alembic check

  build-docker:
    runs-on: ubuntu-latest
    needs: [checks-control-plane, typecheck-svelte, test-svelte, check-migration-drift]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # No DockerHub login here on purpose: both builds below use push:false
      # (this job only validates the image builds — the real push+login lives
      # in release.yml, gated on push-to-main). A login step here served no
      # purpose except failing on Dependabot PRs, which never receive repo
      # secrets by GitHub design (`DOCKERHUB_USERNAME`/`DOCKERHUB_TOKEN` come
      # back empty) — every Dependabot-authored PR hit this unconditionally.

      - name: Build control-plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/control-plane
          push: false
          tags: evc-team-relay/control-plane:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/web-publish
          push: false
          tags: evc-team-relay/web-publish:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
